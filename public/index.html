<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 5 — GraphQL Federation App</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- Верхняя панель -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">◆</span>
        <div>
          <div class="brand-title">GraphQL Store</div>
          <div class="brand-sub">Лабораторная работа №5 · Federation</div>
        </div>
      </div>

      <div class="topbar-center">
        <div id="dataset-info" class="pill">загрузка…</div>
        <div id="realtime-pill" class="pill pill-live" title="Поток данных в реальном времени">
          <span class="dot"></span> realtime
        </div>
      </div>

      <div class="topbar-right" id="topology-area"></div>
    </header>

    <!-- Боковое меню -->
    <aside class="sidebar">
      <nav id="nav">
        <button data-entity="products" class="active"><span>📦</span> Товары</button>
        <button data-entity="orders"><span>🧾</span> Заказы</button>
        <button data-entity="users"><span>👤</span> Пользователи</button>
        <button data-entity="reviews"><span>⭐</span> Отзывы</button>
        <button data-entity="analytics"><span>📊</span> Аналитика</button>
        <button data-entity="monitoring"><span>📈</span> Мониторинг</button>
        <button data-entity="search"><span>🔍</span> Поиск</button>
        <button data-entity="realtime"><span>📡</span> Лента событий</button>
      </nav>
      <div class="sidebar-foot">
        <div class="src-title">Источники данных</div>
        <div id="sources-list" class="src-list"></div>
      </div>
    </aside>

    <!-- Контент -->
    <main class="main">
      <section id="toolbar" class="toolbar"></section>
      <section id="content" class="content"></section>
      <footer id="pager" class="pager"></footer>
    </main>
  </div>

  <!-- Выдвижная панель деталей -->
  <aside id="drawer" class="drawer hidden">
    <button class="drawer-close" id="drawer-close">✕</button>
    <div id="drawer-body"></div>
  </aside>
  <div id="overlay" class="overlay hidden"></div>

  <!-- Модальное окно (создание отзыва/заказа) -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
